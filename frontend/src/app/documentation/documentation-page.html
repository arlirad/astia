<section id="documentation" class="section">
  <div class="shell docs-shell">
    <div class="section-head">
      <h1 class="eyebrow">Documentation</h1>
    </div>

    <app-docs-browser
      [pages]="docPages"
      [selectedSlug]="selectedSlug()"
      [renderedContent]="renderedContent()"
      [status]="status()"
      [errorMessage]="errorMessage()"
      [sourceUrl]="sourceUrl()"
      (pageSelected)="openPage($event)"
      (indexSelected)="openIndex()"
      (retryRequested)="reload()"
    />
  </div>
</section>
