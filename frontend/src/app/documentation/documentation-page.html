<section id="documentation" class="section">
  <div class="shell">
    <div class="section-head">
      <p class="eyebrow">Documentation</p>
      <h2>Design notes, boundaries, and current limits.</h2>
      <p>
        Bundled from the repository Markdown sources. Each page links to its GitHub source, and
        prototype-only work is labeled in the content.
      </p>
    </div>

    <app-docs-browser
      [pages]="docPages"
      [selectedSlug]="selectedSlug()"
      (pageSelected)="openPage($event)"
      (indexSelected)="openIndex()"
    />
  </div>
</section>
