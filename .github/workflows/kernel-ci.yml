# Display name only: required status-check contexts are job ids (build-and-test, asan-ubsan, tsan, clang-tidy, clang-format-pr), not this workflow name.
# Keep job ids unique across workflows so a future AArch64 kernel workflow cannot collide with them.
name: Kernel CI (x86_64)

on:
  pull_request:
    branches:
      - main
  merge_group:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      LLVM_VERSION: "18"
      CC: clang-18
      CXX: clang++-18
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
          # Pinned submodules are initialized exactly by toolchain/init-userspace.sh.
          submodules: false

      - name: Derive and validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 tools/astia_version.py \
            --root . \
            --output "$RUNNER_TEMP/astia-version.json" \
            --reject-dirty

      - name: Initialize pinned userspace sources
        run: toolchain/init-userspace.sh

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils \
            build-essential \
            clang-${LLVM_VERSION} \
            cmake \
            cpio \
            g++-aarch64-linux-gnu \
            grub-common \
            grub-pc-bin \
            gzip \
            lld-${LLVM_VERSION} \
            llvm-${LLVM_VERSION} \
            mtools \
            ninja-build \
            python3 \
            qemu-system-arm \
            qemu-system-x86 \
            xorriso \
            xxd \
            zstd
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
          clang-${LLVM_VERSION} --version
          clang++-${LLVM_VERSION} --version
          /usr/lib/llvm-${LLVM_VERSION}/bin/llvm-objcopy --version

      - name: Configure test build
        run: |
          set -o pipefail
          rm -rf build-tests
          mkdir -p build-tests
          cmake -S . -B build-tests -G Ninja \
            -DARCH=x86_64 \
            -DPLATFORM=virt \
            -DBOOT=virt \
            -DASTIA_BUILD_TESTS=ON \
            -DASTIA_CROSS_USERSPACE=ON \
            -DASTIA_ENABLE_EXTERNAL_TESTS=OFF \
            -DASTIA_ENABLE_MANUAL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang-${LLVM_VERSION} \
            -DCMAKE_CXX_COMPILER=clang++-${LLVM_VERSION} \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            2>&1 | tee build-tests/configure.log

      - name: Build kernel and test artifacts
        run: |
          set -o pipefail
          cmake --build build-tests --parallel 4 2>&1 | tee build-tests/build.log

      - name: Run enabled CTest suite
        run: |
          set -o pipefail
          # Two jobs overlap one QEMU test with host-only tests; VM-launching
          # tests hold RESOURCE_LOCK astia-qemu, boot tests are RUN_SERIAL,
          # and build-step tests hold RESOURCE_LOCK astia-build-tree.
          ctest --test-dir build-tests \
            --output-on-failure \
            --output-log build-tests/ctest.log \
            --test-timeout 120 \
            --parallel 2 \
            2>&1 | tee build-tests/ctest-run.log

      - name: Run focused AArch64 FDT parser test
        run: |
          set -o pipefail
          ctest --test-dir build-tests \
            -R '^astia_aarch64_fdt_test$' \
            --output-on-failure \
            --test-timeout 120 \
            2>&1 | tee build-tests/aarch64-fdt-test.log

      - name: Build and run production AArch64 virt early boot smoke
        run: |
          set -o pipefail
          kernel/scripts/run-aarch64-virt-smoke.sh \
            2>&1 | tee build-tests/aarch64-virt-smoke.log

      - name: Upload configure, build, and test logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-ci-logs
          if-no-files-found: warn
          path: |
            build-tests/configure.log
            build-tests/build.log
            build-tests/ctest.log
            build-tests/ctest-run.log
            build-tests/aarch64-fdt-test.log
            build-tests/aarch64-virt-smoke.log
            build-tests/Testing/
            build-tests/**/CMakeError.log
            build-tests/**/CMakeOutput.log
            build-tests/**/*.log
            build-tests/**/*.trace
