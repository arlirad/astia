name: Kernel CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      LLVM_VERSION: "18"
      CC: clang-${LLVM_VERSION}
      CXX: clang++-${LLVM_VERSION}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils \
            build-essential \
            clang \
            cmake \
            cpio \
            g++-aarch64-linux-gnu \
            grub-common \
            grub-pc-bin \
            gzip \
            lld \
            llvm \
            mtools \
            ninja-build \
            python3 \
            qemu-system-x86 \
            xorriso \
            xxd \
            zstd

      - name: Configure test build
        run: |
          rm -rf build-tests
          cmake -S . -B build-tests -G Ninja \
            -DARCH=x86_64 \
            -DPLATFORM=virt \
            -DBOOT=virt \
            -DASTIA_BUILD_TESTS=ON \
            -DASTIA_CROSS_USERSPACE=ON \
            -DASTIA_ENABLE_EXTERNAL_TESTS=OFF \
            -DASTIA_ENABLE_MANUAL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build kernel and test artifacts
        run: cmake --build build-tests --parallel 2

      - name: Run enabled CTest suite
        run: |
          ctest --test-dir build-tests \
            --output-on-failure \
            --output-log build-tests/ctest.log \
            --parallel 2

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kernel-ci-logs
          if-no-files-found: warn
          path: |
            build-tests/ctest.log
            build-tests/Testing/
            build-tests/**/CMakeError.log
            build-tests/**/CMakeOutput.log
            build-tests/**/*.log
            build-tests/**/*.trace
