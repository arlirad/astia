name: AArch64 virt smoke

on:
  pull_request:
    branches:
      - main
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install cross compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils \
            build-essential \
            cmake \
            cpio \
            g++-aarch64-linux-gnu \
            gzip \
            ninja-build \
            python3 \
            qemu-system-arm \
            xxd \
            zstd
          qemu-system-aarch64 --version
          aarch64-linux-gnu-g++ --version

      - name: Build and run focused AArch64 FDT parser tests
        run: |
          cmake -S kernel -B "$RUNNER_TEMP/kernel-fdt-tests" -G Ninja \
            -DARCH=x86_64 \
            -DPLATFORM=virt \
            -DBOOT=virt \
            -DASTIA_BUILD_TESTS=ON \
            -DASTIA_CROSS_USERSPACE=OFF \
            -DCMAKE_BUILD_TYPE=Debug
          cmake --build "$RUNNER_TEMP/kernel-fdt-tests" \
            --target astia_aarch64_fdt_test --parallel 2
          ctest --test-dir "$RUNNER_TEMP/kernel-fdt-tests" \
            -R '^astia_aarch64_fdt_test$' --output-on-failure

      - name: Build and run retained PR105 smoke
        run: smoke/aarch64-virt/run-qemu-smoke.sh

      - name: Build and run production AArch64 virt early boot smoke
        run: kernel/scripts/run-aarch64-virt-smoke.sh

      - name: Verify x86 kernel target still configures and builds
        run: kernel/scripts/check-x86-target.sh
