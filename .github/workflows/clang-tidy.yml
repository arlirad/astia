name: Clang static analysis

on:
  pull_request:
    branches:
      - main
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: clang-tidy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      LLVM_VERSION: "18"
      CLANG_TIDY_TIMEOUT: "120"
      CLANG_TIDY_JOBS: "2"
    steps:
      - name: Check out merge/source tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Clang tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            "clang-${LLVM_VERSION}" \
            "clang-tidy-${LLVM_VERSION}" \
            cmake \
            ninja-build \
            python3
          echo "/usr/lib/llvm-${LLVM_VERSION}/bin" >> "$GITHUB_PATH"
          "clang-${LLVM_VERSION}" --version
          "clang-tidy-${LLVM_VERSION}" --version
          test "$("clang-tidy-${LLVM_VERSION}" --version | sed -n 's/.*LLVM version \([0-9]*\).*/\1/p')" = "${LLVM_VERSION}"

      - name: Load trusted checker and config from base
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clang-tidy-trusted"
          git show "${BASE_SHA}:.github/scripts/check-clang-tidy.py" \
            > "$RUNNER_TEMP/clang-tidy-trusted/check-clang-tidy.py"
          git show "${BASE_SHA}:.github/scripts/clang-tidy-config.yml" \
            > "$RUNNER_TEMP/clang-tidy-trusted/clang-tidy-config.yml"
          test -s "$RUNNER_TEMP/clang-tidy-trusted/check-clang-tidy.py"
          test -s "$RUNNER_TEMP/clang-tidy-trusted/clang-tidy-config.yml"
          python3 -m py_compile \
            "$RUNNER_TEMP/clang-tidy-trusted/check-clang-tidy.py"

      - name: Set up Go for actionlint
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32
        with:
          go-version: "1.23.6"

      - name: Lint workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/clang-tidy.yml

      - name: Test PR checker with trusted fixtures
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          trusted="$RUNNER_TEMP/clang-tidy-tests"
          mkdir -p "$trusted/.github/scripts" "$trusted/.github/workflows"
          git show "${BASE_SHA}:.github/scripts/test-check-clang-tidy.py" \
            > "$trusted/.github/scripts/test-check-clang-tidy.py"
          git show "${BASE_SHA}:.github/scripts/test-clang-tidy-workflow.py" \
            > "$trusted/.github/scripts/test-clang-tidy-workflow.py"
          git show "${BASE_SHA}:.github/scripts/clang-tidy-config.yml" \
            > "$trusted/.github/scripts/clang-tidy-config.yml"
          git show "${HEAD_SHA}:.github/scripts/check-clang-tidy.py" \
            > "$trusted/.github/scripts/check-clang-tidy.py"
          git show "${HEAD_SHA}:.github/workflows/clang-tidy.yml" \
            > "$trusted/.github/workflows/clang-tidy.yml"
          python3 "$trusted/.github/scripts/test-check-clang-tidy.py"
          python3 "$trusted/.github/scripts/test-clang-tidy-workflow.py"

      - name: Configure source compilation database
        run: |
          set -euo pipefail
          rm -rf build-clang-tidy
          mkdir -p build-clang-tidy
          cmake -S . -B build-clang-tidy -G Ninja \
            -DARCH=x86_64 \
            -DPLATFORM=virt \
            -DBOOT=virt \
            -DASTIA_BUILD_TESTS=ON \
            -DASTIA_CROSS_USERSPACE=OFF \
            -DASTIA_ENABLE_EXTERNAL_TESTS=OFF \
            -DASTIA_ENABLE_MANUAL_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Debug \
            "-DCMAKE_C_COMPILER=clang-${LLVM_VERSION}" \
            "-DCMAKE_CXX_COMPILER=clang++-${LLVM_VERSION}" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee build-clang-tidy/configure.log

      - name: Build all supported source targets
        run: |
          set -euo pipefail
          cmake --build build-clang-tidy --parallel 2 \
            2>&1 | tee build-clang-tidy/build.log

      - name: Configure and merge AArch64 cross compilation database
        run: |
          set -euo pipefail
          rm -rf build-clang-tidy-aarch64
          mkdir -p build-clang-tidy-aarch64
          cmake -S kernel -B build-clang-tidy-aarch64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/kernel/cmake/toolchain-aarch64-virt.cmake \
            -DARCH=aarch64 \
            -DPLATFORM=virt \
            -DBOOT=virt \
            -DASTIA_BUILD_TESTS=OFF \
            "-DASTIA_AARCH64_VIRT_C_COMPILER=/usr/lib/llvm-${LLVM_VERSION}/bin/clang" \
            "-DASTIA_AARCH64_VIRT_CXX_COMPILER=/usr/lib/llvm-${LLVM_VERSION}/bin/clang++" \
            "-DCMAKE_TRY_COMPILE_PLATFORM_VARIABLES=ASTIA_AARCH64_VIRT_C_COMPILER;ASTIA_AARCH64_VIRT_CXX_COMPILER" \
            "-DCMAKE_C_FLAGS=--target=aarch64-linux-gnu" \
            "-DCMAKE_CXX_FLAGS=--target=aarch64-linux-gnu" \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            2>&1 | tee build-clang-tidy-aarch64/configure.log
          python3 - build-clang-tidy/compile_commands.json build-clang-tidy-aarch64/compile_commands.json <<'PY'
          import json
          import pathlib
          import sys

          host_path, arch_path = map(pathlib.Path, sys.argv[1:3])
          host = json.loads(host_path.read_text(encoding="utf-8"))
          arch = json.loads(arch_path.read_text(encoding="utf-8"))
          seen = set()
          for entry in host:
              directory = pathlib.Path(entry.get("directory", ".")).resolve()
              file = pathlib.Path(entry["file"])
              if not file.is_absolute():
                  file = directory / file
              seen.add(str(file.resolve()))
          added = 0
          for entry in arch:
              directory = pathlib.Path(entry["directory"]).resolve()
              file = pathlib.Path(entry["file"])
              if not file.is_absolute():
                  file = directory / file
              file = str(file.resolve())
              if file in seen:
                  continue
              normalized = dict(entry)
              normalized["directory"] = str(directory)
              normalized["file"] = file
              host.append(normalized)
              seen.add(file)
              added += 1
          host_path.write_text(json.dumps(host), encoding="utf-8")
          print(f"merged {added} AArch64 compile database entrie(s)")
          PY

      - name: Analyze changed source lines
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after || github.sha }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/clang-tidy-trusted/check-clang-tidy.py" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --root . \
            --build build-clang-tidy \
            --clang-tidy "clang-tidy-${LLVM_VERSION}" \
            --jobs "$CLANG_TIDY_JOBS" \
            --timeout "$CLANG_TIDY_TIMEOUT" \
            2>&1 | tee build-clang-tidy/clang-tidy.log

      - name: Upload analysis logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clang-tidy-logs
          if-no-files-found: warn
          path: |
            build-clang-tidy/configure.log
            build-clang-tidy/build.log
            build-clang-tidy/clang-tidy.log
            build-clang-tidy-aarch64/configure.log
