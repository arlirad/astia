name: C/C++ formatting

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_tree:
        description: Check every tracked C/C++ source and header file
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  clang-format:
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'clang-format-pr' || 'clang-format-baseline' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CLANG_FORMAT_VERSION: 18.1.8
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.12"

      - name: Install pinned clang-format
        run: |
          python -m pip install \
            --disable-pip-version-check \
            --no-cache-dir \
            --only-binary=:all: \
            "clang-format==${CLANG_FORMAT_VERSION}"

      - name: Verify clang-format version
        run: |
          expected="clang-format version ${CLANG_FORMAT_VERSION}"
          actual="$(clang-format --version)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Expected %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          fi

      - name: Check workflow triggers and check contexts
        run: python3 .github/scripts/test-clang-format-workflow.py

      - name: Check include category fixtures
        run: .github/scripts/test-format-fixtures.sh

      - name: Check changed-file range handling
        run: .github/scripts/test-check-format.sh

      - name: Check cpp-style checker fixtures
        run: python3 .github/scripts/test-check-cpp-style.py

      - name: Check control-statement style
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.sha || github.event_name == 'push' && github.event.after || github.sha }}
          CLANG_FORMAT_FULL_TREE: ${{ inputs.full_tree || '0' }}
        run: |
          if [[ "${CLANG_FORMAT_FULL_TREE}" == "1" ]]; then
            python3 .github/scripts/check-cpp-style.py --full-tree
          else
            base="${BASE_SHA}"
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ||
                  "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
              git fetch --no-tags origin main:refs/remotes/origin/main || true
              if git rev-parse --verify --quiet origin/main >/dev/null; then
                base="$(git merge-base "${HEAD_SHA}" origin/main)"
              fi
            fi
            python3 .github/scripts/check-cpp-style.py \
              --base "${base}" \
              --head "${HEAD_SHA}"
          fi

      - name: Check formatting
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'merge_group' && github.sha || github.event_name == 'push' && github.event.after || github.sha }}
          CLANG_FORMAT_FULL_TREE: ${{ inputs.full_tree || '0' }}
        run: .github/scripts/check-format.sh
